<!DOCTYPE html>
<html>
<head>
    <title>Shop Project</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>My Shop</h1>
    <p>Online Shopping Store</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#products">Products</a>
    <a href="#contact">Contact</a>
</nav>

<section class="hero">
    <h2>Welcome to My Shop</h2>
    <p>Quality products at affordable prices</p>
</section>

<section id="products" class="products">

    <div class="product">
        <h3>Wireless Headphones</h3>
        <p>₹1,499</p>
        <button onclick="addToCart('Wireless Headphones')">
            Add to Cart
        </button>
    </div>

    <div class="product">
        <h3>Smart Watch</h3>
        <p>₹2,499</p>
        <button onclick="addToCart('Smart Watch')">
            Add to Cart
        </button>
    </div>

    <div class="product">
        <h3>Bluetooth Speaker</h3>
        <p>₹999</p>
        <button onclick="addToCart('Bluetooth Speaker')">
            Add to Cart
        </button>
    </div>

</section>

<section class="cart">
    <h2>Shopping Cart</h2>
    <p id="cartMessage">Your cart is empty.</p>
</section>

<footer id="contact">
    <p>© 2026 My Shop | AWS DevOps Project</p>
</footer>

<script src="app.js"></script>

</body>
</html>
